# Nixpacks Configuration for Zzenith Store
# This configures a hybrid environment with both Node.js (for building React) and Python (for running Flask).

[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
    "cd frontend && npm install",
    "cd backend && pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "cd frontend && npm run build"
]

[start]
cmd = "cd backend && gunicorn app:app"
