# Nixpacks — API + Admin Panel (build React, serve via Flask)
[phases.setup]
nixPkgs = ["python311", "nodejs_20"]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "cd admin-panel && npm install"
]

[phases.build]
cmds = [
    "cd admin-panel && npm run build",
    "mkdir -p api/static/admin && cp -r admin-panel/dist/* api/static/admin/"
]

[start]
cmd = "gunicorn --timeout 600 --workers 1 --threads 8 --worker-class gthread main:app"
